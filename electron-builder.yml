appId: io.github.aidind.nib
productName: Nib
directories:
  buildResources: resources
files:
  - out/**
  - resources/**
win:
  target:
    - nsis
  # The multi-size .ico, so 16 and 32 get the simple drawing rather than a
  # downscaled version of the detailed one. See scripts/generate-icon.mjs.
  icon: resources/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: AidinD
  repo: nib
  releaseType: release
