appId: io.github.aidind.nib
productName: Nib
directories:
  buildResources: resources
files:
  - out/**
  - resources/**
# The voice separation is a native addon whose DLLs are loaded by Windows, not
# by Electron, and Windows cannot read inside an asar archive. Unpacked, the
# addon and onnxruntime.dll sit side by side on disk where the loader finds them.
asarUnpack:
  - node_modules/sherpa-onnx-win-x64/**
win:
  target:
    - nsis
  # The multi-size .ico, so 16 and 32 get the simple drawing rather than a
  # downscaled version of the detailed one. See scripts/generate-icon.mjs.
  icon: resources/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: AidinD
  repo: nib
  releaseType: release
